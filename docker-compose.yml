x-bot-common: &bot-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "5"

services:

  # TurtleQuant — digital option pricing on longer-dated Polymarket crypto markets
  # Mode is CLI-only: --shadow (default below), --paper, --live --i-accept-live-risk
  turtlequant-bot:
    <<: *bot-common
    container_name: turtlequant-bot
    command:
      - "uv"
      - "run"
      - "python"
      - "scripts/turtlequant_bot.py"
      - "--shadow"
      - "--asset"
      - "btc,eth"
    volumes:
      - /opt/turtlequant/state:/app/state
      - /opt/turtlequant/data:/app/data
      - /opt/monitoring/alertmanager/secrets/turtlequant-webhook:/run/secrets/discord-webhook:ro
    environment:
      ASSET: "btc,eth"
      ENTRY_THRESHOLD: "0.05"
      KELLY_FRACTION: "0.25"
      STARTING_NAV: "1000.0"
      STATE_DIR: "/app/state"
      LOG_FILE: "/app/state/turtlequant-bot.log"
      DERIBIT_CLIENT_ID: "${DERIBIT_CLIENT_ID:-}"
      DERIBIT_CLIENT_SECRET: "${DERIBIT_CLIENT_SECRET:-}"
      POLYMARKET_PRIVATE_KEY: "${POLYMARKET_PRIVATE_KEY:-}"
      PRIVATE_KEY: "${PRIVATE_KEY:-}"
      POLYMARKET_API_KEY: "${POLYMARKET_API_KEY:-}"
      POLYMARKET_API_SECRET: "${POLYMARKET_API_SECRET:-}"
      POLYMARKET_API_PASSPHRASE: "${POLYMARKET_API_PASSPHRASE:-}"
      CLOB_API_KEY: "${CLOB_API_KEY:-}"
      CLOB_API_SECRET: "${CLOB_API_SECRET:-}"
      CLOB_API_PASSPHRASE: "${CLOB_API_PASSPHRASE:-}"
      POLYMARKET_SIGNATURE_TYPE: "${POLYMARKET_SIGNATURE_TYPE:-0}"
      POLYMARKET_FUNDER: "${POLYMARKET_FUNDER:-}"
      DISCORD_TRADES: "${DISCORD_TRADES:-all}"
      DISCORD_CHART_INTERVAL: "${DISCORD_CHART_INTERVAL:-4h}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,time; p=os.environ.get('LOG_FILE','/app/state/turtlequant-bot.log'); exit(0 if os.path.isfile(p) and time.time()-os.path.getmtime(p)<180 else 1)\"",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Prometheus metrics exporter — reads TurtleQuant JSON state files
  turtlequant-grafana-exporter:
    image: python:3.12-slim
    container_name: turtlequant-grafana-exporter
    command: >
      sh -c "pip install prometheus_client requests numpy -q &&
             python /app/scripts/grafana_exporter.py"
    volumes:
      - /opt/turtlequant/state:/opt/turtlequant/state:ro
      - .:/app
    ports:
      - "127.0.0.1:8004:8004"
    networks:
      - monitoring_net
    restart: unless-stopped
    environment:
      EXPORTER_PORT: "8004"
      STATE_DIR: "/opt/turtlequant/state"
      PYTHONPATH: "/app/src"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/metrics', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  monitoring_net:
    external: true
