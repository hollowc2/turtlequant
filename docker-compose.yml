x-bot-common: &bot-common
  # One image, built from uv.lock, for the bot and the exporter.
  image: turtlequant:local
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  # Run tini as PID 1 so exited children are reaped. Python as PID 1 never
  # reaps, so every timed-out healthcheck was left behind as a zombie.
  init: true
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "5"

services:

  # TurtleQuant — digital option pricing on longer-dated Polymarket crypto markets
  # Mode is CLI-only: --shadow (default below), --paper, --live --i-accept-live-risk
  turtlequant-bot:
    <<: *bot-common
    container_name: turtlequant-bot
    command:
      - "python"
      - "scripts/turtlequant_bot.py"
      - "--shadow"
      - "--asset"
      - "btc,eth"
    volumes:
      - /opt/turtlequant/state:/app/state
      - /opt/turtlequant/data:/app/data
      - /opt/monitoring/alertmanager/secrets/turtlequant-webhook:/run/secrets/discord-webhook:ro
    environment:
      ASSET: "btc,eth"
      ENTRY_THRESHOLD: "0.05"
      KELLY_FRACTION: "0.25"
      STARTING_NAV: "1000.0"
      STATE_DIR: "/app/state"
      LOG_FILE: "/app/state/turtlequant-bot.log"
      DERIBIT_CLIENT_ID: "${DERIBIT_CLIENT_ID:-}"
      DERIBIT_CLIENT_SECRET: "${DERIBIT_CLIENT_SECRET:-}"
      # No wallet or CLOB API secrets here: shadow/paper only read public
      # books and fees. They are passed by docker-compose.live.yml alone.
      DISCORD_TRADES: "${DISCORD_TRADES:-all}"
      DISCORD_CHART_INTERVAL: "${DISCORD_CHART_INTERVAL:-1h}"
      MAX_ASSET_DELTA_PCT: "0.20"
      # The legacy model prices <3-day barrier markets 5-7pp above the market
      # mid (marks 2026-09-25/26), so enter nothing resolving within a week.
      # Those markets are still marked for scripts/evaluate_models.py.
      MIN_ENTRY_HOURS: "168"
      # Nor anything resolving beyond 90 days: Kelly ignores holding time, so a
      # 5pp edge over a year earns ~5%/yr while tying up the exposure cap, and
      # no far-dated marks have resolved to validate the model out there.
      MAX_ENTRY_HOURS: "2160"
      # Price, mark and exit on the smile model: on resolved marks through
      # 2026-10-03 it beats the market mid on Brier (0.0177 vs 0.0185) while
      # legacy does not (0.0196). Entries still need legacy to agree.
      PRICING_MODEL: "smile"
      MODEL_CONSENSUS: "true"
      # Smile's NO-side edge trades are the only net-positive bucket in
      # scripts/evaluate_models.py (+0.047/share over 64 trades).
      SIDES: "yes,no"
      # Hold to resolution unless the bid, net of fee, beats the model.
      EXIT_RULE: "ev"
    healthcheck:
      # Log written within 180s. Healthchecks use the shell, not python: a
      # python start costs ~50x the CPU and timed out on a starved host.
      test: ["CMD-SHELL", "find \"$${LOG_FILE:-/app/state/turtlequant-bot.log}\" -mmin -3 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Prometheus metrics exporter — reads TurtleQuant JSON state files
  # Runs from the lockfile-built bot image. Only src/ and scripts/ are
  # mounted (read-only) so the checkout's .env never reaches this container.
  turtlequant-grafana-exporter:
    <<: *bot-common
    container_name: turtlequant-grafana-exporter
    command: ["python", "scripts/grafana_exporter.py"]
    volumes:
      - /opt/turtlequant/state:/opt/turtlequant/state:ro
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
    ports:
      - "127.0.0.1:8004:8004"
    networks:
      - monitoring_net
    environment:
      EXPORTER_PORT: "8004"
      STATE_DIR: "/opt/turtlequant/state"
    healthcheck:
      # /metrics answers 200. Prometheus already scrapes every 15s, so check
      # once a minute with bash rather than a python start every 30s.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8004 && printf 'GET /metrics HTTP/1.0\\r\\n\\r\\n' >&3 && head -c 12 <&3 | grep -q ' 200'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  monitoring_net:
    external: true
