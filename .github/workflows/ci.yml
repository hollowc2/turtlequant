name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned by commit (tags are mutable).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.11.16"  # same uv as the Dockerfile and uv.lock
      - name: Install (locked, with dev tools)
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Test
        # Tests use recorded API fixtures and fakes; they need no network.
        run: uv run --frozen pytest -q
