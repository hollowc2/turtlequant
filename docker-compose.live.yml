# Live trading, run as its own Compose project beside the shadow bot:
#
#   docker compose -f docker-compose.live.yml up -d --build
#
# Use this file alone, never as an override on docker-compose.yml. Its own
# project name and container names leave the shadow containers untouched, so
# shadow keeps running as the comparison for live fills. Each service extends
# its shadow counterpart (init, logging, healthcheck) and changes only what
# live needs: its own state, the wallet secrets and its own metrics label.
#
# The live bot's traffic, and only its, leaves through a Portugal VPN (the
# turtlequant-vpn container below). Polymarket rejects order placement from
# helios's own address (Paris, FR); reads such as books and balances still work.
# Shadow and the other bots on helios keep the host's connection.
name: turtlequant-live

services:
  # Private Internet Access over OpenVPN. Gluetun's firewall allows nothing out
  # except through the tunnel, so if the VPN drops the bot has no network at all
  # (it never falls back to helios's Paris address). The bot shares this
  # container's network namespace, so it reaches Polymarket, Deribit and the RPC
  # from the VPN's exit.
  # v3.41.3, not v3.40.0: the older release dials PIA ports (1197/501) that PIA's
  # servers no longer answer on, so the tunnel never came up from helios.
  turtlequant-vpn:
    image: qmcgaw/gluetun:v3.41.3
    container_name: turtlequant-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: "private internet access"
      VPN_TYPE: "openvpn"
      # PIA account (not a Polymarket secret), set in /opt/turtlequant-app/.env.
      OPENVPN_USER: "${PIA_USERNAME:-}"
      OPENVPN_PASSWORD: "${PIA_PASSWORD:-}"
      SERVER_REGIONS: "${PIA_REGION:-Portugal}"
      TZ: "UTC"

  turtlequant-bot-live:
    extends:
      file: docker-compose.yml
      service: turtlequant-bot
    container_name: turtlequant-bot-live
    # The bot exits non-zero on purpose when live trading must not start (no
    # MAX_ORDER_USD, or an unreconciled order intent). Retry a few times for
    # transient faults, then stay down for an operator instead of crash-looping.
    restart: "on-failure:3"
    # Share the VPN container's network: no own interface, no published ports.
    network_mode: "service:turtlequant-vpn"
    depends_on:
      turtlequant-vpn:
        condition: service_healthy
    command:
      - "python"
      - "scripts/turtlequant_bot.py"
      - "--live"
      - "--i-accept-live-risk"
      - "--asset"
      - "btc,eth"
    volumes:
      # Same container path as shadow's state mount, so this replaces it.
      - /opt/turtlequant/state/live-state:/app/state
    environment:
      # Size from the wallet's funding, not shadow's $1,000 paper NAV. Used
      # only on the first start in an empty live-state, which writes the
      # positions file.
      STARTING_NAV: "100.0"
      # Hard cap on any single buy, whatever Kelly and NAV say; also the
      # per-market cap at 10% of a $100 wallet.
      MAX_ORDER_USD: "10.0"
      # Research capture is shadow-only; shadow already collects it.
      RESEARCH_CAPTURE: "false"
      # Wallet and CLOB API secrets are passed to the live bot only, and only
      # under their POLYMARKET_* names. The shared .env also holds other bots'
      # PRIVATE_KEY / CLOB_API_*; passing those aliases would let live sign
      # with another bot's wallet whenever POLYMARKET_PRIVATE_KEY is unset.
      POLYMARKET_PRIVATE_KEY: "${POLYMARKET_PRIVATE_KEY:-}"
      POLYMARKET_API_KEY: "${POLYMARKET_API_KEY:-}"
      POLYMARKET_API_SECRET: "${POLYMARKET_API_SECRET:-}"
      POLYMARKET_API_PASSPHRASE: "${POLYMARKET_API_PASSPHRASE:-}"
      POLYMARKET_SIGNATURE_TYPE: "0"
      POLYMARKET_FUNDER: ""

  turtlequant-grafana-exporter-live:
    extends:
      file: docker-compose.yml
      service: turtlequant-grafana-exporter
    container_name: turtlequant-grafana-exporter-live
    # Shadow's exporter holds host port 8004; Prometheus scrapes this one by
    # container name on monitoring_net (job "turtlequant-live").
    ports: !override
      - "127.0.0.1:8005:8004"
    volumes:
      - /opt/turtlequant/state/live-state:/opt/turtlequant/state:ro
      # Shadow's state, read-only, to pair each live fill with shadow's fill
      # on the same market (the dashboard's Live vs Shadow row). It holds no
      # secrets, and the exporter never writes either state dir.
      - /opt/turtlequant/state:/opt/turtlequant/shadow-state:ro
    environment:
      STRATEGY: "turtlequant-live"
      PAIR_STATE_DIR: "/opt/turtlequant/shadow-state"

networks:
  monitoring_net:
    external: true
